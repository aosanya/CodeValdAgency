syntax = "proto3";

package codevaldagency.v1;

option go_package = "github.com/aosanya/CodeValdAgency/gen/go/codevaldagency/v1;codevaldagencyv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ── Enumerations ─────────────────────────────────────────────────────────────

// AgencyDraftStatus mirrors the Go AgencyDraftStatus type.
enum AgencyDraftStatus {
  AGENCY_DRAFT_STATUS_UNSPECIFIED = 0;
  AGENCY_DRAFT_STATUS_OPEN        = 1;
  AGENCY_DRAFT_STATUS_PROMOTED    = 2;
  AGENCY_DRAFT_STATUS_ARCHIVED    = 3;
}

// RACILabel mirrors the Go RACILabel type.
enum RACILabel {
  RACI_LABEL_UNSPECIFIED  = 0;
  RACI_LABEL_RESPONSIBLE  = 1;  // R
  RACI_LABEL_ACCOUNTABLE  = 2;  // A
  RACI_LABEL_CONSULTED    = 3;  // C
  RACI_LABEL_INFORMED     = 4;  // I
}

// ActorType mirrors the Go ActorType type.
// It declares who is expected to fill a configured role —
// a human actor, an AI agent, or either.
enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_HUMAN       = 1;
  ACTOR_TYPE_AI          = 2;
  ACTOR_TYPE_EITHER      = 3;
}

// ── Sub-document messages ─────────────────────────────────────────────────────

// RoleAssignment binds a role name to a RACI label for a specific Work Item.
message RoleAssignment {
  string    role  = 1;
  RACILabel raci  = 2;
}

// ConfiguredRole is a named role defined by an agency beyond the built-in
// super_admin and admin roles. The actor_type field declares whether the role
// is intended for a human actor, an AI agent, or either.
message ConfiguredRole {
  string    role       = 1;
  ActorType actor_type = 2;
}

// WorkItem is a single unit of work within a Workflow.
message WorkItem {
  string               id          = 1;
  string               title       = 2;
  string               description = 3;
  int32                order       = 4;
  bool                 parallel    = 5;
  repeated string      goal_ids    = 6;
  repeated RoleAssignment assignments = 7;
}

// Workflow is a named container of ordered Work Items.
message Workflow {
  string              id         = 1;
  string              name       = 2;
  repeated WorkItem   work_items = 3;
}

// Goal is a strategic objective that one or more Work Items contribute to.
message Goal {
  string id          = 1;
  string title       = 2;
  string description = 3;
  int32  ordinality  = 4;
}

// ── Core domain message ───────────────────────────────────────────────────────

// Agency is the top-level organisational unit with Mission, Vision, Goals, and Workflows.
message Agency {
  string                    id               = 1;
  string                    name             = 2;
  string                    mission          = 3;
  string                    vision           = 4;
  bool                      enabled          = 5;
  repeated Goal             goals            = 6;
  repeated Workflow         workflows        = 7;
  repeated ConfiguredRole   configured_roles = 8;
  google.protobuf.Timestamp created_at       = 9;
  google.protobuf.Timestamp updated_at       = 10;
}

// ── Filter ───────────────────────────────────────────────────────────────────

// GetAgencyRequest is intentionally empty — there is exactly one agency per database.
message GetAgencyRequest {}

message SetAgencyDetailsRequest {
  // json is the full agency document serialised as a JSON string.
  // Must include a non-empty "id" field.
  string json = 1;
}

// ── Publication messages ──────────────────────────────────────────────────────

// AgencyPublication is an immutable, versioned snapshot of an Agency
// created by an explicit publish action. The agency status is NOT changed.
message AgencyPublication {
  string                    id           = 1;
  Agency                    agency       = 2;
  int32                     version      = 3;
  string                    tag          = 4;
  google.protobuf.Timestamp published_at = 5;
  // draft_id is the ID of the AgencyDraft that was published.
  string                    draft_id     = 6;
  // content_hash is the SHA-256 fingerprint of the draft sub-entity content
  // at publish time. Identical content across two publications produces the
  // same hash; PublishAgency rejects a publish when the hash matches an
  // existing publication.
  string                    content_hash = 7;
  // status is the lifecycle state: draft → active → archived.
  string                    status       = 8;
}

// PublishAgencyRequest carries the draft to publish.
message PublishAgencyRequest {
  // draft_id is the ID of the open AgencyDraft to publish.
  string draft_id = 1;
}

// GetPublicationRequest selects a publication by its version number.
message GetPublicationRequest {
  int32 version = 1;
}

// ListPublicationsRequest is intentionally empty.
message ListPublicationsRequest {}

// ListPublicationsResponse wraps the ordered list of publications.
message ListPublicationsResponse {
  repeated AgencyPublication publications = 1;
}

// UpdatePublicationStatusRequest transitions a publication lifecycle status.
// Allowed transitions: draft → active, active → archived.
message UpdatePublicationStatusRequest {
  int32  version = 1;
  string status  = 2;
}


// GetGoalsRequest is intentionally empty — goals are scoped to the single
// agency in this database.
message GetGoalsRequest {}

// GetGoalsResponse wraps the ordered list of Goals.
message GetGoalsResponse {
  repeated Goal goals = 1;
}

// GetWorkflowsRequest is intentionally empty — workflows are scoped to the
// single agency in this database.
message GetWorkflowsRequest {}

// GetWorkflowsResponse wraps the list of Workflows, each with its WorkItems.
message GetWorkflowsResponse {
  repeated Workflow workflows = 1;
}

// GetConfiguredRolesRequest is intentionally empty — roles are scoped to the
// single agency in this database.
message GetConfiguredRolesRequest {}

// GetConfiguredRolesResponse wraps the list of ConfiguredRoles.
message GetConfiguredRolesResponse {
  repeated ConfiguredRole configured_roles = 1;
}

// GetWorkItemsRequest is intentionally empty — work items are scoped to the
// single agency in this database.
message GetWorkItemsRequest {}

// GetWorkItemsResponse wraps the flat list of live WorkItems.
message GetWorkItemsResponse {
  repeated WorkItem work_items = 1;
}

// ── Draft messages ─────────────────────────────────────────────────────────────

// AgencyDraft is a versioned, editable copy of the agency sub-entity graph
// created by CreateDraft and promoted to live state by PromoteDraft.
message AgencyDraft {
  string                    id               = 1;
  string                    agency_id        = 2;
  string                    description      = 3;
  string                    forked_from_id   = 4;
  string                    forked_from_type = 5;
  AgencyDraftStatus         status           = 6;
  google.protobuf.Timestamp created_at       = 7;
  google.protobuf.Timestamp updated_at       = 8;
}

message CreateDraftRequest {
  // description is a human-readable label for this draft.
  string description      = 1;
  // forked_from_id identifies the source entity to fork from.
  // Set to empty string when forked_from_type is "live".
  string forked_from_id   = 2;
  // forked_from_type must be "live" or "draft".
  string forked_from_type = 3;
}

message GetDraftRequest {
  string draft_id = 1;
}

message ListDraftsRequest {}

message ListDraftsResponse {
  repeated AgencyDraft drafts = 1;
}

message UpdateDraftDescriptionRequest {
  string draft_id     = 1;
  string description  = 2;
}

message PromoteDraftRequest {
  string draft_id = 1;
}

message ArchiveDraftRequest {
  string draft_id = 1;
}

// ── WorkPlan messages ─────────────────────────────────────────────────────────

// WorkPlan binds a trigger topic, a ConfiguredRole, and a WorkItem into an
// executable plan. CodeValdAI calls MatchWorkPlans on every inbound Cross
// event; the agency returns all enabled work plans whose trigger_topic regex
// matches the topic and whose payload_condition matches the raw JSON payload.
message WorkPlan {
  string id                = 1;
  string agency_id         = 2;
  string name              = 3;
  string description       = 4;
  // trigger_topic is a Go regex matched against the Cross event topic.
  string trigger_topic     = 5;
  // payload_condition is a Go regex matched against the raw JSON payload.
  // Empty string matches all payloads.
  string payload_condition = 6;
  // instructions is the prompt template injected into the triggered AgentRun.
  string instructions      = 7;
  // agent_id is a cross-service reference to a CodeValdAI Agent entity ID.
  string agent_id          = 8;
  bool   enabled           = 9;
  int32  ordinality        = 10;
  // handler_service is the CodeVald service responsible for executing this plan
  // (e.g. "codevaldai", "codevaldcomm"). Each service subscribes only to topics
  // from plans where handler_service matches its own service name.
  string handler_service   = 11;
}

// GitContextSource configures what to fetch from CodeValdGit when a work plan matches.
message GitContextSource {
  string signals     = 1;
  int32  max_results = 2;
  string match_mode  = 3;
  bool   cascade     = 4;
  string file_types  = 5;
}

// CommContextSource configures what to fetch from CodeValdComm when a work plan matches.
message CommContextSource {
  int32 lookback_days = 1;
  int32 max_results   = 2;
}

// WorkContextSource configures what to fetch from CodeValdWork when a work plan matches.
message WorkContextSource {
  bool include_description = 1;
  bool include_history     = 2;
}

// ContextSource is a polymorphic wrapper for a typed context source entity.
// Exactly one of git, comm, or work is populated, matching source_type.
message ContextSource {
  string              id          = 1;
  string              work_plan_id = 2;
  // source_type is "GitContextSource", "CommContextSource", or "WorkContextSource".
  string              source_type = 3;
  GitContextSource    git         = 4;
  CommContextSource   comm        = 5;
  WorkContextSource   work        = 6;
}

// WorkPlanMatch pairs a matched WorkPlan with all its linked ContextSource entities.
// Returned by MatchWorkPlans ordered by work_plan.ordinality ascending.
message WorkPlanMatch {
  WorkPlan                work_plan       = 1;
  repeated ContextSource  context_sources = 2;
}

// CreateWorkPlanRequest carries the fields for creating a new WorkPlan.
message CreateWorkPlanRequest {
  string name              = 1;
  string description       = 2;
  string trigger_topic     = 3;
  string payload_condition = 4;
  string instructions      = 5;
  string agent_id          = 6;
  bool   enabled           = 7;
  int32  ordinality        = 8;
  string handler_service   = 9;
}

// GetWorkPlanRequest selects a WorkPlan by its entity ID.
message GetWorkPlanRequest {
  string work_plan_id = 1;
}

// ListWorkPlansRequest is intentionally empty — work plans are scoped to the single agency.
message ListWorkPlansRequest {}

// ListWorkPlansResponse wraps the list of WorkPlans.
message ListWorkPlansResponse {
  repeated WorkPlan work_plans = 1;
}

// UpdateWorkPlanRequest carries the fields that may be changed on an existing WorkPlan.
message UpdateWorkPlanRequest {
  string work_plan_id      = 1;
  string name              = 2;
  string description       = 3;
  string trigger_topic     = 4;
  string payload_condition = 5;
  string instructions      = 6;
  string agent_id          = 7;
  bool   enabled           = 8;
  int32  ordinality        = 9;
  string handler_service   = 10;
}

// DeleteWorkPlanRequest selects a WorkPlan by its entity ID.
message DeleteWorkPlanRequest {
  string work_plan_id = 1;
}

// AddContextSourceRequest carries the typed configuration for a new ContextSource.
message AddContextSourceRequest {
  string            work_plan_id = 1;
  string            source_type  = 2;
  GitContextSource  git          = 3;
  CommContextSource comm         = 4;
  WorkContextSource work         = 5;
}

// ListContextSourcesRequest selects all sources linked to a WorkPlan.
message ListContextSourcesRequest {
  string work_plan_id = 1;
}

// ListContextSourcesResponse wraps the list of ContextSources.
message ListContextSourcesResponse {
  repeated ContextSource context_sources = 1;
}

// RemoveContextSourceRequest identifies the source to remove.
message RemoveContextSourceRequest {
  string work_plan_id = 1;
  string source_id    = 2;
}

// MatchWorkPlansRequest carries the Cross event topic and raw JSON payload to match.
message MatchWorkPlansRequest {
  // topic is the Cross event topic, e.g. "work.task.status.changed".
  string topic   = 1;
  // payload is the raw JSON payload from the Cross event.
  string payload = 2;
}

// MatchWorkPlansResponse wraps the list of matched work plans with their context sources.
message MatchWorkPlansResponse {
  repeated WorkPlanMatch matches = 1;
}

// ── Import messages ─────────────────────────────────────────────────────────

// ImportDraftRequest carries the raw YAML (or JSON) body of an agency.yaml file.
// CodeValdCross wraps the raw request body into the body field automatically —
// HTTP callers send the file content as the raw request body.
message ImportDraftRequest {
  // body contains the raw agency.yaml (or agency.json) file content.
  string body = 1;
}

// ImportDraftResponse is returned on a successful import.
message ImportDraftResponse {
  // agency_id is the code value from the YAML agency.code field.
  string agency_id = 1;
  // draft_id is the server-assigned UUID of the open AgencyDraft entity.
  string draft_id  = 2;
}

// ── Service ───────────────────────────────────────────────────────────────────

// AgencyService exposes agency lifecycle management operations via gRPC.
// All mutations are validated and lifecycle-guarded by the AgencyManager.
service AgencyService {
  // SetAgencyDetails replaces the full agency document from a JSON string.
  // Error: INVALID_ARGUMENT if the JSON is malformed or the id field is missing.
  // Error: FAILED_PRECONDITION if the agency has already been published (Enabled=true).
  rpc SetAgencyDetails(SetAgencyDetailsRequest) returns (Agency);

  // GetAgency retrieves the single agency for this database.
  // Error: NOT_FOUND if no agency document exists yet.
  rpc GetAgency(GetAgencyRequest) returns (Agency);

  // PublishAgency creates an immutable versioned publication of the current
  // agency state.
  // Error: NOT_FOUND if no agency document exists yet.
  rpc PublishAgency(PublishAgencyRequest) returns (AgencyPublication);

  // GetPublication retrieves a single publication by version number.
  // Error: NOT_FOUND if no publication with that version exists.
  rpc GetPublication(GetPublicationRequest) returns (AgencyPublication);

  // ListPublications returns all publications in ascending version order.
  rpc ListPublications(ListPublicationsRequest) returns (ListPublicationsResponse);

  // UpdatePublicationStatus transitions a publication to a new lifecycle status.
  // Allowed transitions: draft → active, active → archived.
  // Error: NOT_FOUND if no publication with that version exists.
  // Error: INVALID_ARGUMENT if the transition is not allowed.
  rpc UpdatePublicationStatus(UpdatePublicationStatusRequest) returns (AgencyPublication);

  // GetGoals returns all live Goal entities linked to the Agency.
  rpc GetGoals(GetGoalsRequest) returns (GetGoalsResponse);

  // GetWorkflows returns all live Workflow entities linked to the Agency.
  rpc GetWorkflows(GetWorkflowsRequest) returns (GetWorkflowsResponse);

  // GetConfiguredRoles returns all live ConfiguredRole entities linked to the Agency.
  rpc GetConfiguredRoles(GetConfiguredRolesRequest) returns (GetConfiguredRolesResponse);

  // GetWorkItems returns all live WorkItem entities linked to the Agency.
  rpc GetWorkItems(GetWorkItemsRequest) returns (GetWorkItemsResponse);

  // CreateDraft creates a new editable draft by deep-copying the sub-entity
  // graph from the nominated source.
  // Error: NOT_FOUND if no agency document exists.
  // Error: NOT_FOUND if forked_from_type=="draft" and the source draft does not exist.
  // Error: FAILED_PRECONDITION if the source draft is not open.
  rpc CreateDraft(CreateDraftRequest) returns (AgencyDraft);

  // GetDraft retrieves a single draft by its ID.
  // Error: NOT_FOUND if no draft with that ID exists.
  rpc GetDraft(GetDraftRequest) returns (AgencyDraft);

  // ListDrafts returns all drafts for this agency in creation order.
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);

  // UpdateDraftDescription replaces the description of an open draft.
  // Error: NOT_FOUND if the draft does not exist.
  // Error: FAILED_PRECONDITION if the draft is not open.
  rpc UpdateDraftDescription(UpdateDraftDescriptionRequest) returns (AgencyDraft);

  // PromoteDraft copies draft sub-entities into the live graph, enables the
  // agency, marks the draft promoted, and writes a snapshot.
  // Error: NOT_FOUND if the draft does not exist.
  // Error: FAILED_PRECONDITION if the draft is not open.
  rpc PromoteDraft(PromoteDraftRequest) returns (Agency);

  // ArchiveDraft marks an open draft as archived without promoting it.
  // Error: NOT_FOUND if the draft does not exist.
  // Error: FAILED_PRECONDITION if the draft is not open.
  rpc ArchiveDraft(ArchiveDraftRequest) returns (AgencyDraft);

  // ImportDraft parses a raw agency.yaml (or agency.json) body, sets the agency
  // details, creates or reuses an open draft, and idempotently upserts all
  // sub-entities (DraftConfiguredRole, DraftGoal, DraftWorkflow, DraftWorkItem,
  // DraftInstruction, DraftDeliverable) in one shot.
  // The body field must contain the raw file content — CodeValdCross wraps the
  // HTTP request body into this field automatically.
  // Error: INVALID_ARGUMENT if the body cannot be parsed.
  rpc ImportDraft(ImportDraftRequest) returns (ImportDraftResponse);

  // ── WorkPlan RPCs ─────────────────────────────────────────────────────────────

  // CreateWorkPlan stores a new WorkPlan and links it to the Agency.
  // Error: INVALID_ARGUMENT if trigger_topic or payload_condition is not a valid Go regex.
  rpc CreateWorkPlan(CreateWorkPlanRequest) returns (WorkPlan);

  // GetWorkPlan retrieves a single WorkPlan by its entity ID.
  // Error: NOT_FOUND if no WorkPlan with that ID exists.
  rpc GetWorkPlan(GetWorkPlanRequest) returns (WorkPlan);

  // ListWorkPlans returns all WorkPlans linked to this Agency.
  rpc ListWorkPlans(ListWorkPlansRequest) returns (ListWorkPlansResponse);

  // UpdateWorkPlan applies the request fields to an existing WorkPlan.
  // Error: NOT_FOUND if no WorkPlan with that ID exists.
  // Error: INVALID_ARGUMENT if trigger_topic or payload_condition is not a valid Go regex.
  rpc UpdateWorkPlan(UpdateWorkPlanRequest) returns (WorkPlan);

  // DeleteWorkPlan removes a WorkPlan by its entity ID.
  // Error: NOT_FOUND if no WorkPlan with that ID exists.
  rpc DeleteWorkPlan(DeleteWorkPlanRequest) returns (google.protobuf.Empty);

  // AddContextSource creates a typed ContextSource entity and links it to a WorkPlan.
  // Error: NOT_FOUND if no WorkPlan with that ID exists.
  rpc AddContextSource(AddContextSourceRequest) returns (ContextSource);

  // ListContextSources returns all ContextSource entities linked to a WorkPlan.
  // Error: NOT_FOUND if no WorkPlan with that ID exists.
  rpc ListContextSources(ListContextSourcesRequest) returns (ListContextSourcesResponse);

  // RemoveContextSource deletes a ContextSource and removes its edge from the WorkPlan.
  // Error: NOT_FOUND if the ContextSource does not exist.
  rpc RemoveContextSource(RemoveContextSourceRequest) returns (google.protobuf.Empty);

  // MatchWorkPlans evaluates the topic and payload against all enabled WorkPlans.
  // Returns matching work plans with their ContextSources, ordered by ordinality.
  rpc MatchWorkPlans(MatchWorkPlansRequest) returns (MatchWorkPlansResponse);
}
